version: 2

# Pre-real_capital hygiene: keep web3 / py-clob-client / eth-account /
# anthropic-sdk current so CVEs do not silently sit in uv.lock. Grouped
# minor/patch updates reduce PR noise; majors stay separate so they are
# reviewed individually.
#
# Note: uv-lockfile support landed in Dependabot in 2025 under the `pip`
# ecosystem (Dependabot reads pyproject.toml + uv.lock natively). If the
# scheduler ignores uv.lock in this repo for any reason, switch to a
# Renovate config (renovate.json) with `"uv": {"enabled": true}`.

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "facchini-mika"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    assignees:
      - "facchini-mika"
