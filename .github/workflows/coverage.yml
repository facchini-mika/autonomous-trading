name: coverage

# Per-module coverage gates per specs/engineering.md §11:
#   src/risk/       100%   (protected-code hard gate)
#   src/execution/  ≥ 87%  floor at current; target ≥ 90% per spec.
#                          The 87→90 catch-up is tracked in AUDIT_LOG;
#                          raise --cov-fail-under as missing tests land.
#   src/shared/     ≥ 80%
#   src/research/   ≥ 80%

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Setup Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --frozen
      - name: risk (100%)
        run: uv run pytest --cov=src/risk --cov-fail-under=100 tests/risk/
      - name: execution (floor 87%, target ≥90% per spec §11)
        run: uv run pytest --cov=src/execution --cov-fail-under=87 tests/
      - name: shared + research (≥80%)
        run: uv run pytest --cov=src/shared --cov=src/research --cov-fail-under=80 tests/
