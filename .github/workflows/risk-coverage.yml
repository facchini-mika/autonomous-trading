name: risk-coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  risk-coverage:
    name: risk-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Setup Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --frozen
      - name: pytest --cov=risk --cov-fail-under=100
        run: uv run pytest --cov=risk --cov-fail-under=100 tests/risk/
