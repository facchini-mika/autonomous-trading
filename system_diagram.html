<!DOCTYPE html>

<head>

<title>Autonomous Polymarket Trading System</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;

    background: #fafaf7;
    color: #0f172a;
  }
  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 36px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  svg { display: block; width: 100%; height: auto; }
  @media print {
    body { background: #fff; padding: 0; }
    .wrap { border: none; box-shadow: none; padding: 12px; }
  }
</style>
</head>
