repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # trufflehog deferred — pre-commit hook builds from Go source (5+ min on first install
  # due to mongo/couchbase deps). gitleaks alone covers MVP secret scanning.
  # Re-add via Docker-backed hook in Phase 1 CI if dual-scanner is desired.
  - repo: local
    hooks:
      - id: risk-no-pragma-no-cover
        name: "forbid '# pragma: no cover' in risk/"
        entry: bash -c 'staged=$(git diff --cached --name-only --diff-filter=ACMR | grep "^risk/" || true); [ -z "$staged" ] && exit 0; if git diff --cached -- $staged | grep -E "^\+.*pragma:\s*no\s*cover"; then echo "pragma:no-cover not allowed in risk/"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
