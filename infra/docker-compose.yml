services:
  postgres:
    image: postgres:16-alpine
    container_name: autonomous_trading_postgres
    environment:
      POSTGRES_DB: autonomous_trading
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD_TRADING_CYCLE: ${PGPASSWORD_TRADING_CYCLE:-dev_trading_cycle}
      PGPASSWORD_OUTCOME_INGESTION: ${PGPASSWORD_OUTCOME_INGESTION:-dev_outcome_ingestion}
      PGPASSWORD_LESSONS_SUMMARY: ${PGPASSWORD_LESSONS_SUMMARY:-dev_lessons_summary}
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonomous_trading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
