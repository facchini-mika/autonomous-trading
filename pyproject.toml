[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk", "src/shared", "src/execution", "src/research"]

[project]
name = "polymarket-autonomous-trading"
version = "0.0.0"
description = "Autonomous Polymarket trading MVP"
requires-python = ">=3.12,<3.13"
authors = [{ name = "facchini-mika", email = "148874194+facchini-mika@users.noreply.github.com" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "py-clob-client>=0.17",
  "eth-account>=0.13",
  "cryptography>=43",
  "openai>=1.50",
  "web3>=7",
  "httpx>=0.27",
  "structlog>=24",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.115",
  "pre-commit>=4",
  "vulture>=2.13",
  "import-linter>=2.0",
  "pytest-mock>=3.14",
  "respx>=0.21",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
  "ANN401",
  "TD002",
  "TD003",
  "FIX002",
  "TRY003",
  "EM101",
  "EM102",
  "S608",
  "BLE001",
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN", "SLF001", "INP001", "TC001", "TC002", "TC003", "S603", "S607", "PLC0415", "S105", "S106", "ARG001", "ARG002", "FBT003", "PLW0108", "RUF002", "SIM108"]
"alembic/**" = ["INP001", "D", "TC001", "TC002", "TC003"]
# Claude Code hooks: stdin-driven scripts with multiple guard returns and
# subprocess calls whose arguments are hardcoded or resolved via shutil.which.
".claude/hooks/**" = ["INP001", "PLR0911", "S603"]
# Pydantic models need imports at runtime for schema generation; the
# TC* rules incorrectly suggest moving them under TYPE_CHECKING.
"src/shared/models/**" = ["TC001", "TC002", "TC003"]
"src/shared/adapters/**" = ["TC001", "TC002", "TC003"]
# shared/db.py uses Iterator at runtime in @contextmanager generator; do not
# move it to TYPE_CHECKING.
"src/shared/db.py" = ["TC003"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
enable_error_code = ["truthy-bool", "redundant-expr", "possibly-undefined"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["py_clob_client.*", "respx", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/risk", "src/shared", "src/execution", "src/research"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.importlinter]
root_packages = ["shared", "risk"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-down package layers"
type = "layers"
layers = [
    "risk",
    "shared.adapters",
    "shared.models",
    "shared.config",
]
containers = [""]

[[tool.importlinter.contracts]]
name = "risk-isolation"
type = "forbidden"
source_modules = ["risk"]
forbidden_modules = ["shared.adapters", "shared.db", "py_clob_client", "web3"]

[tool.vulture]
# Used by the Auto-Cleanup workflow (.github/workflows/auto-cleanup.yml).
# `paths` is intentionally not set here — the workflow constructs the
# scan list dynamically and skips dirs that do not exist yet.
min_confidence = 80
sort_by_size = true
exclude = ["src/risk/", "tests/", "alembic/versions/"]
ignore_decorators = ["@app.route", "@pytest.fixture"]
