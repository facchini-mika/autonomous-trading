[project]
name = "autonomous-trading"
version = "0.1.0"
description = "Autonomous Polymarket trading system with AI agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "httpx>=0.28",
    "anthropic>=0.40",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "openai>=2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-redis>=4.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["risk", "execution", "shared"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
